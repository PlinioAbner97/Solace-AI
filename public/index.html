<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="description" content="Solace AI — The AI Companion That Grows With You" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Solace" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <!-- Open Graph for sharing -->
    <meta property="og:title" content="Solace AI" />
    <meta property="og:description" content="An AI companion that remembers your story, checks in daily, and grows with you." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Solace AI" />
    <meta name="twitter:description" content="An AI companion that remembers your story, checks in daily, and grows with you." />

    <title>Solace AI</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { background: #0c0a09; overflow-x: hidden; overscroll-behavior-y: none; }
      body { min-height: 100vh; min-height: 100dvh; }
      #root { min-height: 100vh; min-height: 100dvh; }
      input, textarea, select { font-size: 16px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
