<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="description" content="Solace AI — The AI Companion That Grows With You" />

    <!-- iOS PWA support — lets users "Add to Home Screen" for an app-like feel -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Solace AI" />
    <meta name="mobile-web-app-capable" content="yes" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>" />
    <title>Solace AI</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { background: #0a0a0c; overflow-x: hidden; overscroll-behavior-y: none; }
      body { min-height: 100vh; min-height: 100dvh; }
      #root { min-height: 100vh; min-height: 100dvh; }
      input, textarea, select { font-size: 16px; } /* prevents iOS auto-zoom on focus */
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
